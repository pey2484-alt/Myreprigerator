<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>나의 냉장고를 부탁해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FFB8D2;
    --pink-deep:#FF8FB4;
    --pink-pale:#FFE6F0;
    --mint:#BDEFE0;
    --lavender:#DCC9F7;
    --butter:#FFE8A8;
    --cream:#FFF8FB;
    --plum:#5B3A52;
    --plum-soft:#8A6B84;
    --white:#FFFFFF;
    --shadow: 0 8px 24px rgba(255, 143, 180, 0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%; overscroll-behavior:none;}
  body{
    font-family:'Jua','Apple SD Gothic Neo',sans-serif;
    background: linear-gradient(160deg, var(--cream) 0%, var(--pink-pale) 55%, #FDEFFA 100%);
    color:var(--plum);
    height:100vh;
    height:100dvh;
    overflow:hidden;
    position:relative;
  }
  #sparkle-bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .sparkle{
    position:absolute;
    opacity:0.55;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.6));
    animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.8) rotate(0deg);}
    50%{ opacity:0.7; transform:scale(1.15) rotate(20deg);}
  }
  #app{
    position:relative;
    z-index:1;
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:0;
    overflow:hidden;
  }
  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:24px 22px 10px;
    animation: fadeIn 0.35s ease;
    overflow:hidden;
  }
  .screen.active{ display:flex; }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px);}
    to{ opacity:1; transform:translateY(0);}
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Jua',sans-serif;
    border:none;
    border-radius:20px;
    padding:16px 20px;
    font-size:17px;
    cursor:pointer;
    color:var(--plum);
    background:var(--white);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-primary{
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color:#fff;
  }
  .btn-mint{ background: linear-gradient(135deg, #CDF5E8 0%, var(--mint) 100%); }
  .btn-lav{ background: linear-gradient(135deg, #EBE0FB 0%, var(--lavender) 100%); }
  .btn-butter{ background: linear-gradient(135deg, #FFF1C6 0%, var(--butter) 100%); }
  .btn-block{ width:100%; }
  .btn-ghost{
    background:transparent;
    box-shadow:none;
    color:var(--plum-soft);
    text-decoration:underline;
    padding:10px;
  }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  /* ---------- Title screen ---------- */
  #screen-title{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:36px;
  }
  .title-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .title-fridge-icon{ font-size:64px; margin-bottom:6px; }
  .title-small{
    font-size:22px;
    color:var(--pink-deep);
  }
  .title-big{
    font-size:52px;
    line-height:1.25;
    color:var(--plum);
    text-shadow: 3px 3px 0 rgba(255,184,210,0.5);
  }
  .title-sub{
    font-size:14px;
    color:var(--plum-soft);
    margin-top:4px;
  }

  /* ---------- Menu screen ---------- */
  .menu-header{ text-align:center; margin-bottom:28px; }
  .menu-header .emoji{ font-size:40px; }
  .menu-header h2{ font-size:26px; margin:8px 0 0; }
  .menu-list{ display:flex; flex-direction:column; gap:16px; }
  .menu-card{
    display:flex; align-items:center; gap:14px;
    background:var(--white);
    border-radius:22px;
    padding:20px;
    box-shadow: var(--shadow);
    cursor:pointer;
    border: 2px solid transparent;
    transition: transform .15s ease, border-color .15s ease;
  }
  .menu-card:active{ transform: scale(0.97); }
  .menu-card .icon{ font-size:34px; }
  .menu-card .txt b{ display:block; font-size:19px; }
  .menu-card .txt span{ font-size:12px; color:var(--plum-soft); }
  .menu-card.pink{ border-color: var(--pink); }
  .menu-card.mint{ border-color: var(--mint); }
  .menu-card.lav{ border-color: var(--lavender); }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .topbar .back{
    background:var(--white); border:none; border-radius:50%;
    width:40px;height:40px; font-size:18px; cursor:pointer;
    box-shadow: var(--shadow);
  }
  .topbar h3{ font-size:19px; margin:0; }
  .topbar .spacer{ width:40px; }

  /* ---------- Fridge select screen ---------- */
  .fridge-wrap{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .fridge-closed{
    width:220px; height:280px;
    background: linear-gradient(160deg, #FFFFFF 0%, var(--pink-pale) 100%);
    border-radius:28px;
    border:6px solid var(--pink);
    box-shadow: var(--shadow);
    position:relative;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:10px;
    transition: transform .2s ease;
  }
  .fridge-closed:active{ transform: scale(0.97); }
  .fridge-closed::before{
    content:"";
    position:absolute; left:16px; top:14px; bottom:14px; width:2px;
    background: rgba(255,143,180,0.35);
  }
  .fridge-handle{
    position:absolute; right:14px; top:40%;
    width:10px; height:56px; border-radius:8px;
    background: var(--pink-deep);
  }
  .fridge-closed .cta{
    font-size:15px; color:var(--pink-deep);
    background:#fff; padding:8px 14px; border-radius:14px;
    box-shadow: 0 4px 10px rgba(255,143,180,0.3);
  }
  .fridge-closed .big-emoji{ font-size:56px; }

  .select-panel{ width:100%; display:none; flex-direction:column; gap:16px; flex:1; }
  .select-panel.active{ display:flex; }
  .category-tabs{ display:flex; gap:8px; }
  .cat-tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:16px;
    font-size:14px; background:#fff; color:var(--plum-soft);
    box-shadow: 0 3px 8px rgba(255,143,180,0.15);
    cursor:pointer; border:none; font-family:'Jua',sans-serif;
    transition: transform .12s ease;
  }
  .cat-tab:active{ transform: scale(0.96); }
  .cat-tab.current{
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color:#fff;
  }
  .cat-title-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cat-title{ display:flex; align-items:center; gap:8px; font-size:20px; }
  #select-all-btn{ padding:8px 14px; font-size:12.5px; flex-shrink:0; }
  .ingredient-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:10px;
    overflow-y:auto; padding-bottom:6px;
    flex:1; min-height:0;
  }
  .ing-item{
    display:flex; align-items:center; gap:8px;
    background:#fff; border-radius:14px; padding:12px 10px;
    box-shadow: 0 3px 8px rgba(255,143,180,0.14);
    font-size:13.5px;
    cursor:pointer;
    border:2px solid transparent;
  }
  .ing-item.checked{
    border-color: var(--pink-deep);
    background: var(--pink-pale);
  }
  .ing-item .box{
    width:20px;height:20px;border-radius:6px;
    border:2px solid var(--pink-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;flex-shrink:0;
  }
  .ing-item.checked .box{ background:var(--pink-deep); }
  .select-footer{ display:flex; gap:8px; margin-top:4px; }
  .select-footer .btn{ padding:11px 16px; font-size:14px; border-radius:16px; }
  .select-count{
    text-align:center; font-size:12px; color:var(--plum-soft); margin-top:2px;
  }

  /* ---------- Recipe list screen ---------- */
  .recipe-grid{ display:flex; flex-direction:column; gap:14px; overflow-y:auto; flex:1; min-height:0; }
  .recipe-card{
    background:#fff; border-radius:20px; padding:16px 18px;
    box-shadow: var(--shadow); cursor:pointer;
    display:flex; flex-direction:column; gap:6px;
  }
  .recipe-card .rname{ font-size:19px; }
  .recipe-card .rgroup{ font-size:11px; color:var(--pink-deep); background:var(--pink-pale); align-self:flex-start; padding:2px 10px; border-radius:10px;}
  .recipe-card .rtags{ font-size:12px; color:var(--plum-soft); }
  .recipe-card .rmissing{ font-size:11.5px; color:#C98A9B; }
  .empty-box{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; padding:20px;
  }
  .empty-box .emoji{ font-size:52px; }
  .empty-box p{ font-size:15px; line-height:1.6; color:var(--plum-soft); margin:0; }
  .delivery-btn{
    background: linear-gradient(135deg,#FFD3A6,#FFB199);
    color:#fff;
  }

  /* ---------- Recipe detail ---------- */
  .step-wrap{ flex:1; display:flex; flex-direction:column; }
  .step-progress{
    display:flex; gap:6px; margin-bottom:16px;
  }
  .step-progress .dot{
    flex:1; height:6px; border-radius:4px; background:#F3D9E4;
  }
  .step-progress .dot.done{ background: var(--pink-deep); }
  .step-card{
    flex:1;
    background:#fff; border-radius:26px; padding:28px 24px;
    box-shadow: var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px;
  }
  .step-card .step-emoji{ font-size:52px; }
  .step-card .step-title{ font-size:21px; }
  .step-card .step-text{ font-size:15px; line-height:1.7; color:var(--plum-soft); }
  .step-nav{ display:flex; gap:10px; margin-top:16px; }
  .finish-box{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center;
  }
  .finish-box .emoji{ font-size:70px; }
  .finish-box h2{ font-size:26px; margin:0; }
  .finish-box p{ color:var(--plum-soft); margin:0; }

  /* ---------- Archive ---------- */
  .archive-add{
    background:#fff; border-radius:20px; padding:18px; box-shadow: var(--shadow);
    display:flex; flex-direction:column; gap:12px; margin-bottom:18px;
  }
  .archive-add select, .archive-add input[type=file]{
    font-family:'Jua',sans-serif;
    border-radius:14px; border:2px solid var(--pink-pale);
    padding:10px; font-size:14px; background:#FFFBFD;
  }
  .archive-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; overflow-y:auto; flex:1; min-height:0; align-content:start; }
  .archive-item{
    background:#fff; border-radius:18px; overflow:hidden; box-shadow: var(--shadow);
    display:flex; flex-direction:column; position:relative;
  }
  .archive-item img{ width:100%; height:110px; object-fit:cover; }
  .archive-item .noimg{
    width:100%; height:110px; display:flex; align-items:center; justify-content:center;
    background: var(--pink-pale); font-size:30px;
  }
  .archive-item .cap{ padding:8px 10px; font-size:12.5px; display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .archive-item .cap .date{ display:block; font-size:10.5px; color:var(--plum-soft); }
  .archive-delete{
    border:none; border-radius:50%; width:22px; height:22px; flex-shrink:0;
    background: var(--pink-pale); color:var(--pink-deep); font-size:12px;
    cursor:pointer; line-height:1; font-family:'Jua',sans-serif;
  }
  .archive-empty{ text-align:center; color:var(--plum-soft); font-size:14px; padding:30px 10px; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--pink); border-radius:6px; }
</style>
</head>
<body>

<div id="sparkle-bg"></div>
<div id="app">

  <!-- 1. Title -->
  <section class="screen active" id="screen-title">
    <div class="title-block">
      <div class="title-fridge-icon">🧊🍳</div>
      <div class="title-small">나의</div>
      <div class="title-big">냉장고를<br/>부탁해</div>
      <div class="title-sub">있는 재료로, 오늘 뭐 해먹지?</div>
    </div>
    <button class="btn btn-primary btn-block" style="max-width:220px;" onclick="goTo('menu')">시작해 ✨</button>
  </section>

  <!-- 2. Menu -->
  <section class="screen" id="screen-menu">
    <div class="menu-header">
      <div class="emoji">🧺</div>
      <h2>무엇을 할까요?</h2>
    </div>
    <div class="menu-list">
      <div class="menu-card pink" onclick="goTo('select')">
        <div class="icon">🥬</div>
        <div class="txt"><b>재료 선택하기</b><span>냉장고 문을 열고 재료를 체크해요</span></div>
      </div>
      <div class="menu-card mint" onclick="openRecipeList()">
        <div class="icon">📖</div>
        <div class="txt"><b>레시피 보기</b><span>선택한 재료로 만들 수 있는 메뉴</span></div>
      </div>
      <div class="menu-card lav" onclick="goTo('archive')">
        <div class="icon">📸</div>
        <div class="txt"><b>아카이브</b><span>내가 완성한 요리 모아보기</span></div>
      </div>
    </div>
  </section>

  <!-- 3. Ingredient select -->
  <section class="screen" id="screen-select">
    <div class="topbar">
      <button class="back" onclick="goTo('menu')">◀</button>
      <h3>재료 선택하기</h3>
      <div class="spacer"></div>
    </div>

    <div class="fridge-wrap" id="fridge-closed-wrap">
      <div class="fridge-closed" onclick="openFridge()">
        <div class="big-emoji">🧊</div>
        <div class="fridge-handle"></div>
        <div class="cta">문 열어보기</div>
      </div>
    </div>

    <div id="select-panel-area" style="display:none; flex:1; min-height:0; flex-direction:column;">
      <div class="category-tabs" id="category-tabs"></div>
      <div class="cat-title-row">
        <div class="cat-title" id="cat-title"></div>
        <button class="btn btn-lav" id="select-all-btn" onclick="toggleSelectAllCurrentCategory()">모두 선택</button>
      </div>
      <div class="ingredient-grid" id="ingredient-grid"></div>
      <div class="select-count" id="select-count"></div>
      <div class="select-footer">
        <button class="btn btn-ghost" id="prev-cat-btn" onclick="prevCategory()">이전</button>
        <button class="btn btn-primary btn-block" id="next-cat-btn" onclick="nextCategory()">다음 →</button>
      </div>
    </div>
  </section>

  <!-- 4. Recipe list -->
  <section class="screen" id="screen-recipes">
    <div class="topbar">
      <button class="back" onclick="goTo('menu')">◀</button>
      <h3>만들 수 있는 메뉴</h3>
      <div class="spacer"></div>
    </div>
    <div id="recipes-content" style="flex:1; min-height:0; display:flex; flex-direction:column;"></div>
  </section>

  <!-- 5. Recipe detail -->
  <section class="screen" id="screen-detail">
    <div class="topbar">
      <button class="back" onclick="goTo('recipes')">◀</button>
      <h3 id="detail-title"></h3>
      <div class="spacer"></div>
    </div>
    <div id="detail-content" style="flex:1; display:flex; flex-direction:column;"></div>
  </section>

  <!-- 6. Archive -->
  <section class="screen" id="screen-archive">
    <div class="topbar">
      <button class="back" onclick="goTo('menu')">◀</button>
      <h3>아카이브 📸</h3>
      <div class="spacer"></div>
    </div>
    <div class="archive-add">
      <select id="archive-recipe-select"></select>
      <input type="file" id="archive-photo-input" accept="image/*" />
      <button class="btn btn-lav btn-block" onclick="addArchive()">기록 추가하기</button>
    </div>
    <div class="archive-grid" id="archive-grid"></div>
  </section>

</div>

<script>
/* =========================================================
   DATA
========================================================= */
const INGREDIENTS = {
  fridge: {
    label: "냉장 보관", emoji:"🧊",
    items: [
      {k:'daepa',l:'대파'},{k:'yangpa',l:'양파'},{k:'maneul',l:'마늘(다진 마늘 포함)'},
      {k:'cheongyang',l:'청양고추'},{k:'honggochu',l:'붉은고추'},{k:'aehobak',l:'애호박'},
      {k:'gamja',l:'감자'},{k:'goguma',l:'고구마'},{k:'danggeun',l:'당근'},
      {k:'paengi',l:'팽이버섯'},{k:'saesongi',l:'새송이버섯'},{k:'kkaennip',l:'깻잎'},
      {k:'sangchu',l:'상추'},{k:'mu',l:'무'},{k:'kongnamul',l:'콩나물'},{k:'sukju',l:'숙주나물'},
      {k:'gyeran',l:'계란'},{k:'dubu',l:'두부'},{k:'spam',l:'스팸'},{k:'ham',l:'햄'},
      {k:'bacon',l:'베이컨'},{k:'eomuk',l:'어묵(오뎅)'},{k:'kimchi',l:'김치'},{k:'danmuji',l:'단무지'},
      {k:'milk',l:'우유'},{k:'butter',l:'버터'},{k:'cheese',l:'치즈(슬라이스)'},{k:'gochujang',l:'고추장'},
      {k:'doenjang',l:'된장'},{k:'ssamjang',l:'쌈장'},{k:'ganjang',l:'간장'},{k:'mayo',l:'마요네즈'},{k:'ketchup',l:'케첩'}
    ]
  },
  frozen: {
    label: "냉동 보관", emoji:"❄️",
    items: [
      {k:'daepaesamgyeop',l:'대패삼겹살'},{k:'samgyeop',l:'삼겹살'},{k:'beef',l:'소고기(국거리/불고기용)'},
      {k:'dakgaseum',l:'닭가슴살'},{k:'dakansim',l:'닭안심'},{k:'shrimp',l:'칵테일 새우'},
      {k:'squid',l:'오징어'},{k:'mandu',l:'냉동 만두'},{k:'tteokgukTteok',l:'떡국떡'},
      {k:'tteokbokkiTteok',l:'떡볶이 떡'},{k:'sliceHam',l:'슬라이스 햄'},
      {k:'frozenGarlic',l:'다진 마늘(냉동)'},{k:'frozenCheongyang',l:'청양고추(다져서 냉동)'}
    ]
  },
  room: {
    label: "실온 보관", emoji:"🌡️",
    items: [
      {k:'ramen',l:'라면'},{k:'somyeon',l:'소면'},{k:'dangmyeon',l:'당면'},
      {k:'hetban',l:'햇반(즉석밥)'},{k:'rice',l:'쌀'},{k:'tuna',l:'참치캔'},
      {k:'canHam',l:'캔햄(스팸)'},{k:'myeolchi',l:'멸치'},{k:'dasima',l:'다시마'},
      {k:'gim',l:'김'},{k:'miyeok',l:'미역'},{k:'oil',l:'식용유'},{k:'chamgireum',l:'참기름'},
      {k:'sugar',l:'설탕'},{k:'salt',l:'소금'},{k:'gochugaru',l:'고춧가루'},
      {k:'vinegar',l:'식초'},{k:'aekjeot',l:'액젓(멸치/까나리)'}
    ]
  }
};
const CATEGORY_ORDER = ['fridge','frozen','room'];
const ALIAS = { frozenGarlic:'maneul', frozenCheongyang:'cheongyang', canHam:'spam' };
const NAME_LOOKUP = {};
Object.values(INGREDIENTS).forEach(cat => cat.items.forEach(i => NAME_LOOKUP[i.k] = i.l));

function step(emoji,title,text){ return {emoji,title,text}; }

const RECIPES = [
  // 1. 밥·볶음밥류
  { id:'ganjanggyeranbap', group:'밥·볶음밥류', name:'간장계란밥',
    req:[['hetban','rice'],['gyeran'],['ganjang'],['chamgireum']], opt:['butter'],
    steps:[
      step('🍚','밥 데우기','햇반을 전자레인지에 뜨겁게 데워서 그릇에 털어 넣어 주세요.'),

/* =========================================================
   STATE  (in-memory only — persists while this page/tab stays open)
========================================================= */
const state = {
  selected: new Set(),
  categoryIndex: 0,
  currentRecipeId: null,
  currentStep: 0,
  archive: [],
  pendingPhotoDataUrl: null
};

/* =========================================================
   NAV
========================================================= */
function goTo(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if(name === 'select'){ renderSelectScreen(); }
  if(name === 'archive'){ renderArchive(); }
  window.scrollTo(0,0);
}

/* =========================================================
   SPARKLES
========================================================= */
function initSparkles(){
  const wrap = document.getElementById('sparkle-bg');
  const glyphs = ['✨','⭐','💫','🩷'];
  const count = 26;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.fontSize = (10 + Math.random()*16) + 'px';
    s.style.animationDelay = (Math.random()*3) + 's';
    s.style.animationDuration = (2.4 + Math.random()*2.2) + 's';
    wrap.appendChild(s);
  }
}

/* =========================================================
   INGREDIENT SELECT
========================================================= */
function openFridge(){
  document.getElementById('fridge-closed-wrap').style.display = 'none';
  document.getElementById('select-panel-area').style.display = 'flex';
  state.categoryIndex = 0;
  renderCategoryTabs();
  renderIngredientGrid();
}
function renderSelectScreen(){
  // if already opened before (has selections or user opened once) keep panel open state reset to closed each visit per spec (문이 먼저 보이고 누르면 열리게)
  document.getElementById('fridge-closed-wrap').style.display = 'flex';
  document.getElementById('select-panel-area').style.display = 'none';
}
function renderCategoryTabs(){
  const tabsEl = document.getElementById('category-tabs');
  tabsEl.innerHTML = CATEGORY_ORDER.map((key,idx) => {
    const cat = INGREDIENTS[key];
    const cls = idx === state.categoryIndex ? 'cat-tab current' : 'cat-tab';
    return `<button type="button" class="${cls}" onclick="goToCategory(${idx})">${cat.emoji} ${cat.label}</button>`;
  }).join('');
}
function goToCategory(idx){
  state.categoryIndex = idx;
  renderCategoryTabs();
  renderIngredientGrid();
}
function renderIngredientGrid(){
  const catKey = CATEGORY_ORDER[state.categoryIndex];
  const cat = INGREDIENTS[catKey];
  document.getElementById('cat-title').innerHTML = `${cat.emoji} <span>${cat.label} 재료</span>`;
  const grid = document.getElementById('ingredient-grid');
  grid.innerHTML = cat.items.map(item => {
    const checked = state.selected.has(item.k);
    return `<div class="ing-item ${checked?'checked':''}" onclick="toggleIngredient('${item.k}')">
      <div class="box">${checked?'✓':''}</div><div>${item.l}</div>
    </div>`;
  }).join('');
  document.getElementById('select-count').textContent = `지금까지 ${state.selected.size}개 선택했어요`;
  document.getElementById('prev-cat-btn').style.visibility = state.categoryIndex === 0 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('next-cat-btn');
  nextBtn.textContent = state.categoryIndex === CATEGORY_ORDER.length - 1 ? '선택완료 ✓' : '다음 →';
  const allChecked = cat.items.every(item => state.selected.has(item.k));
  document.getElementById('select-all-btn').textContent = allChecked ? '모두 해제' : '모두 선택';
}
function toggleIngredient(k){
  if(state.selected.has(k)) state.selected.delete(k);
  else state.selected.add(k);
  renderIngredientGrid();
}
function toggleSelectAllCurrentCategory(){
  const catKey = CATEGORY_ORDER[state.categoryIndex];
  const cat = INGREDIENTS[catKey];
  const allChecked = cat.items.every(item => state.selected.has(item.k));
  cat.items.forEach(item => {
    if(allChecked) state.selected.delete(item.k);
    else state.selected.add(item.k);
  });
  renderIngredientGrid();
}
function prevCategory(){
  if(state.categoryIndex > 0){
    state.categoryIndex--;
    renderCategoryTabs();
    renderIngredientGrid();
  }
}
function nextCategory(){
  if(state.categoryIndex < CATEGORY_ORDER.length - 1){
    state.categoryIndex++;
    renderCategoryTabs();
    renderIngredientGrid();
  } else {
    openRecipeList();
  }
}

/* =========================================================
   MATCHING
========================================================= */
function normalizedSelected(){
  const s = new Set(state.selected);
  state.selected.forEach(k => { if(ALIAS[k]) s.add(ALIAS[k]); });
  return s;
}
function isGroupSatisfied(group, selectedSet){
  return group.some(k => selectedSet.has(k));
}
function missingLabelsForRecipe(recipe, selectedSet){
  return recipe.req.filter(g => !isGroupSatisfied(g, selectedSet))
    .map(g => g.map(k => NAME_LOOKUP[k]).join('/'));
}
function matchedRecipes(){
  const sel = normalizedSelected();
  return RECIPES.filter(r => r.req.every(g => isGroupSatisfied(g, sel)));
}

/* =========================================================
   RECIPE LIST
========================================================= */
function openRecipeList(){
  goTo('recipes');
  renderRecipeList();
}
function renderRecipeList(){
  const content = document.getElementById('recipes-content');
  if(state.selected.size === 0){
    content.innerHTML = `
      <div class="empty-box">
        <div class="emoji">🐶</div>
        <p>냉장고에 먼지만 날리네요!<br/>재료가 없으면 배달의민족으로<br/>순간이동 하는 게 빠를지도 몰라요 🚀</p>
        <button class="btn delivery-btn" onclick="window.open('https://www.baemin.com','_blank')">배달앱 보러가기</button>
        <button class="btn btn-mint" onclick="goTo('select')">재료부터 선택할래요</button>
      </div>`;
    return;
  }
  const list = matchedRecipes();
  if(list.length === 0){
    content.innerHTML = `
      <div class="empty-box">
        <div class="emoji">🥲</div>
        <p>레시피를 만들 재료가 없어요.</p>
        <button class="btn btn-mint" onclick="goTo('select')">재료 더 담으러 가기</button>
      </div>`;
    return;
  }
  const sel = normalizedSelected();
  content.innerHTML = `<div class="recipe-grid">` + list.map(r => {
    const optHave = r.opt.filter(k => sel.has(k)).map(k => NAME_LOOKUP[k]);
    return `<div class="recipe-card" onclick="openRecipeDetail('${r.id}')">
      <div class="rgroup">${r.group}</div>
      <div class="rname">${r.name}</div>
      <div class="rtags">필요한 재료가 모두 있어요 ${optHave.length ? '· 가지고 계신 선택 재료: ' + optHave.join(', ') : ''}</div>
    </div>`;
  }).join('') + `</div>
  <button class="btn btn-ghost" style="margin-top:12px;" onclick="goTo('select')">재료 다시 고르기</button>`;
}

/* =========================================================
   RECIPE DETAIL
========================================================= */
function openRecipeDetail(id){
  state.currentRecipeId = id;
  state.currentStep = 0;
  goTo('detail');
  renderDetail();
}
function renderDetail(){
  const recipe = RECIPES.find(r => r.id === state.currentRecipeId);
  document.getElementById('detail-title').textContent = recipe.name;
  const content = document.getElementById('detail-content');

  if(state.currentStep >= recipe.steps.length){
    content.innerHTML = `
      <div class="finish-box">
        <div class="emoji">🎉🍳</div>
        <h2>${recipe.name} 완성!</h2>
        <p>오늘도 냉장고를 구해냈어요.</p>
        <button class="btn btn-primary btn-block" style="max-width:240px;" onclick="goToArchiveWithRecipe('${recipe.id}')">아카이브에 기록하기</button>
        <button class="btn btn-ghost" onclick="goTo('recipes')">메뉴로 돌아가기</button>
      </div>`;
    return;
  }

  const s = recipe.steps[state.currentStep];
  const dots = recipe.steps.map((_,i) => `<div class="dot ${i <= state.currentStep ? 'done':''}"></div>`).join('');
  content.innerHTML = `
    <div class="step-wrap">
      <div class="step-progress">${dots}</div>
      <div class="step-card">
        <div class="step-emoji">${s.emoji}</div>
        <div class="step-title">${s.title}</div>
        <div class="step-text">${s.text}</div>
      </div>
      <div class="step-nav">
        <button class="btn btn-ghost" ${state.currentStep===0?'style="visibility:hidden;"':''} onclick="prevStep()">이전 단계</button>
        <button class="btn btn-primary btn-block" onclick="nextStep()">${state.currentStep === recipe.steps.length-1 ? '요리 완성! 🎉' : '다음 단계 →'}</button>
      </div>
    </div>`;
}
function prevStep(){ if(state.currentStep>0){ state.currentStep--; renderDetail(); } }
function nextStep(){ state.currentStep++; renderDetail(); }

/* =========================================================
   ARCHIVE
========================================================= */
function goToArchiveWithRecipe(id){
  goTo('archive');
  document.getElementById('archive-recipe-select').value = id;
}
function renderArchive(){
  const select = document.getElementById('archive-recipe-select');
  select.innerHTML = RECIPES.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  const grid = document.getElementById('archive-grid');
  if(state.archive.length === 0){
    grid.innerHTML = `<div class="archive-empty" style="grid-column:1/3;">아직 기록한 요리가 없어요.<br/>완성한 요리를 사진과 함께 남겨보세요 🍽️</div>`;
    return;
  }
  grid.innerHTML = state.archive.map((entry, idx) => ({entry, idx})).reverse().map(({entry, idx}) => {
    const img = entry.photo
      ? `<img src="${entry.photo}" alt="${entry.name}" />`
      : `<div class="noimg">🍽️</div>`;
    return `<div class="archive-item">
      ${img}
      <div class="cap">
        <span>${entry.name}<span class="date">${entry.date}</span></span>
        <button type="button" class="archive-delete" onclick="deleteArchive(${idx})" aria-label="삭제">✕</button>
      </div>
    </div>`;
  }).join('');
}
function deleteArchive(idx){
  state.archive.splice(idx, 1);
  renderArchive();
}
function addArchive(){
  const select = document.getElementById('archive-recipe-select');
  const fileInput = document.getElementById('archive-photo-input');
  const recipe = RECIPES.find(r => r.id === select.value);
  const file = fileInput.files[0];
  const dateStr = new Date().toLocaleDateString('ko-KR', {month:'2-digit', day:'2-digit'});

  const pushEntry = (photoDataUrl) => {
    state.archive.push({ name: recipe.name, date: dateStr, photo: photoDataUrl });
    fileInput.value = '';
    renderArchive();
  };
  if(file){
    const reader = new FileReader();
    reader.onload = e => pushEntry(e.target.result);
    reader.readAsDataURL(file);
  } else {
    pushEntry(null);
  }
}

/* =========================================================
   INIT
========================================================= */
initSparkles();
</script>
